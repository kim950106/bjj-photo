<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#090b0e"/>
<title>BJJ Vision</title>
<style>
:root{--bg:#090b0e;--panel:#13171d;--panel2:#1a2028;--line:#2b333d;--text:#f7f8fa;--muted:#98a3b2;--good:#9ce5b4;--warn:#ffd77d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 60px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:14px;background:#fff;color:#111;display:grid;place-items:center;font-weight:950}.brand h1{margin:0;font-size:23px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.drop{display:block;background:var(--panel2);border:1px dashed #607084;border-radius:18px;padding:34px 16px;text-align:center;cursor:pointer}.drop b{display:block;font-size:19px;margin-bottom:7px}.drop span{font-size:13px;color:var(--muted)}input[type=file]{display:none}.status{margin-top:15px;color:var(--muted);font-size:13px;line-height:1.6}.progress{height:9px;background:#0d1015;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#fff;transition:width .15s}.preview{display:none;margin-top:14px;border-radius:14px;overflow:hidden;background:#000}.preview video{display:block;width:100%;max-height:330px}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#0f1318;border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:21px}.stat small{color:var(--muted)}.segment{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}.time{color:var(--muted);font-variant-numeric:tabular-nums}.label{font-weight:850}.note{font-size:12px;color:var(--muted);margin-top:4px}.conf{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 7px;white-space:nowrap}.badge{display:inline-block;font-size:11px;color:var(--warn);border:1px solid #5c5030;border-radius:999px;padding:4px 8px;margin-left:5px}.again{width:100%;border:0;border-radius:13px;background:#fff;color:#111;font-weight:900;padding:14px;margin-top:16px;font-size:15px;cursor:pointer}.legal{font-size:11px;color:#697485;line-height:1.55;margin-top:13px}@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}.segment{grid-template-columns:62px 1fr}.conf{grid-column:2}.wrap{padding-top:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">BJJ</div><div><h1>BJJ Vision <span class="badge">BETA</span></h1><div class="sub">영상 하나 넣으면 바로 자동 분석</div></div></div>

  <section class="card">
    <label class="drop" for="videoFile">
      <b id="fileTitle">🎥 스파링 영상 넣기</b>
      <span id="fileSub">누르면 휴대폰 영상 선택 · 선택 즉시 분석 시작</span>
    </label>
    <input id="videoFile" type="file" accept="video/*"/>
    <div id="preview" class="preview"><video id="video" playsinline controls preload="auto"></video></div>
    <div id="status" class="status">설정할 것 없습니다. 영상만 선택하세요.</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
  </section>

  <section id="result" class="card hidden">
    <div><b>자동 분석 결과</b><span class="badge">후보 판정 포함</span></div>
    <div class="summary">
      <div class="stat"><b id="duration">0:00</b><small>영상 길이</small></div>
      <div class="stat"><b id="frames">0</b><small>분석 프레임</small></div>
      <div class="stat"><b id="twoRate">0%</b><small>2인 검출률</small></div>
    </div>
    <div id="dominant" class="status"></div>
    <div id="timeline"></div>
    <button class="again" id="again">다른 영상 분석</button>
    <div class="legal">현재 버전은 일반 2인 포즈 AI를 이용한 실험 분석입니다. Standing/Ground는 비교적 직접 판정하고, Guard·Side·Mount·Back은 자세 기하학 기반 후보 판정입니다. 정확한 IBJJF 점수·탭·서브미션은 주짓수 전용 학습모델을 추가하는 단계가 필요합니다.</div>
  </section>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm";
const $=id=>document.getElementById(id);
let landmarker=null, loading=null, objectUrl=null, prevA=null, prevB=null;
const fmt=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const P=(l,i)=>l?.[i]||{x:0,y:0,z:0,visibility:0};
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2,visibility:avg([a.visibility||0,b.visibility||0])});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function centroid(l){const ids=[11,12,23,24,25,26];const ps=ids.map(i=>P(l,i)).filter(p=>(p.visibility??1)>.22);return{x:avg(ps.map(p=>p.x)),y:avg(ps.map(p=>p.y))}}
function quality(l){return avg([11,12,23,24,25,26,27,28].map(i=>P(l,i).visibility||0))}
function torso(l){const s=mid(P(l,11),P(l,12)),h=mid(P(l,23),P(l,24));const dx=h.x-s.x,dy=h.y-s.y;return{s,h,len:Math.hypot(dx,dy),vertical:Math.abs(dy)/(Math.abs(dx)+Math.abs(dy)+1e-6),angle:Math.atan2(dy,dx)}}
function aDiff(a,b){let d=Math.abs(a-b);while(d>Math.PI)d=Math.abs(d-2*Math.PI);return d}
function state(l){const t=torso(l),h=t.h,k=mid(P(l,25),P(l,26)),an=mid(P(l,27),P(l,28)),q=quality(l);const standing=t.vertical>.66&&t.len>.075&&h.y<.84&&Math.abs(an.y-h.y)>.11;const ground=!standing&&(t.vertical<.60||h.y>.54||Math.abs(k.y-h.y)<.12);return{t,h,k,an,q,standing,ground,c:centroid(l)}}
function classify(A,B){
  if(!A||!B)return{label:"선수 가림/미검출",conf:.32,note:"두 명을 동시에 찾지 못한 구간"};
  const a=state(A),b=state(B),q=Math.min(a.q,b.q),cd=dist(a.c,b.c);
  if(a.standing&&b.standing)return{label:"Standing",conf:Math.min(.96,.64+q*.30),note:"두 선수 모두 기립"};
  if((a.standing&&!b.standing)||(b.standing&&!a.standing))return{label:"Standing → Ground",conf:Math.min(.88,.56+q*.25),note:"기립-지면 전환 구간"};
  if(a.ground&&b.ground){
    const diff=aDiff(a.t.angle,b.t.angle)*180/Math.PI;
    const ak1=P(A,25),ak2=P(A,26),bk1=P(B,25),bk2=P(B,26);
    const astr=(Math.min(ak1.x,ak2.x)<b.h.x&&Math.max(ak1.x,ak2.x)>b.h.x)&&dist(a.h,b.t.s)<.23;
    const bstr=(Math.min(bk1.x,bk2.x)<a.h.x&&Math.max(bk1.x,bk2.x)>a.h.x)&&dist(b.h,a.t.s)<.23;
    if((astr||bstr)&&cd<.26)return{label:"Mount 후보",conf:Math.min(.82,.46+q*.32),note:"무릎/힙이 상대 몸통을 양쪽에서 감싸는 형태"};
    if(diff<30&&dist(a.h,b.h)<.20&&cd<.23)return{label:"Back 후보",conf:Math.min(.74,.41+q*.27),note:"몸통 방향과 힙이 겹치는 형태 · 훅은 별도 확인 필요"};
    if(diff>48&&cd<.29)return{label:"Side Control 후보",conf:Math.min(.80,.47+q*.29),note:"몸통 축이 교차하며 밀착된 형태"};
    const aleg=Math.min(dist(P(A,25),b.h),dist(P(A,26),b.h),dist(P(A,27),b.h),dist(P(A,28),b.h));
    const bleg=Math.min(dist(P(B,25),a.h),dist(P(B,26),a.h),dist(P(B,27),a.h),dist(P(B,28),a.h));
    if(Math.min(aleg,bleg)<.18&&cd<.34)return{label:"Guard / Half 후보",conf:Math.min(.78,.45+q*.28),note:"하체가 상대 힙/다리 주변을 제어하는 형태"};
    return{label:"Ground / Scramble",conf:Math.min(.86,.54+q*.25),note:"양 선수 지면 상태 · 세부 포지션 불명확"};
  }
  return{label:"Transition",conf:Math.min(.72,.42+q*.22),note:"포지션 전환 구간"};
}
function assign(poses){
  if(poses.length<2)return{A:poses[0]||null,B:null};
  const p0=poses[0],p1=poses[1],c0=centroid(p0),c1=centroid(p1);
  if(!prevA||!prevB){const A=c0.x<=c1.x?p0:p1,B=c0.x<=c1.x?p1:p0;prevA=centroid(A);prevB=centroid(B);return{A,B}}
  const same=dist(c0,prevA)+dist(c1,prevB),swap=dist(c1,prevA)+dist(c0,prevB);const A=same<=swap?p0:p1,B=same<=swap?p1:p0;prevA=centroid(A);prevB=centroid(B);return{A,B};
}
async function model(){
  if(landmarker)return landmarker;if(loading)return loading;
  loading=(async()=>{const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm");const base={modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"};try{return await PoseLandmarker.createFromOptions(vision,{baseOptions:{...base,delegate:"GPU"},runningMode:"VIDEO",numPoses:2,minPoseDetectionConfidence:.30,minPosePresenceConfidence:.30,minTrackingConfidence:.30})}catch(e){return await PoseLandmarker.createFromOptions(vision,{baseOptions:base,runningMode:"VIDEO",numPoses:2,minPoseDetectionConfidence:.30,minPosePresenceConfidence:.30,minTrackingConfidence:.30})}})();landmarker=await loading;return landmarker;
}
function waitSeek(v,t){return new Promise((res,rej)=>{const done=()=>{v.removeEventListener("seeked",done);res()};v.addEventListener("seeked",done,{once:true});v.currentTime=Math.min(t,Math.max(0,v.duration-.03));setTimeout(()=>res(),2200)})}
function compress(rows,step){const out=[];for(const r of rows){const last=out[out.length-1];if(last&&last.label===r.label&&r.t-last.end<=step*1.8){last.end=r.t;last.conf=(last.conf+r.conf)/2}else out.push({start:r.t,end:r.t,label:r.label,conf:r.conf,note:r.note})}return out}
async function analyze(file){
  const v=$("video");prevA=prevB=null;$("result").classList.add("hidden");$("bar").style.width="2%";$("status").textContent="AI 모델 준비 중…";
  await model();$("status").textContent="영상 읽는 중…";
  if(v.readyState<2)await new Promise(r=>v.addEventListener("loadeddata",r,{once:true}));
  const duration=v.duration||0;if(!duration)throw new Error("영상 길이를 읽지 못했습니다.");
  const step=duration>600?2:duration>300?1.5:1;const end=duration;const rows=[];let two=0,total=0;
  for(let t=0;t<end;t+=step){await waitSeek(v,t);const r=landmarker.detectForVideo(v,Math.round(t*1000));const poses=r.landmarks||[];total++;if(poses.length>=2)two++;const {A,B}=assign(poses);const c=classify(A,B);rows.push({t,label:c.label,conf:c.conf,note:c.note});$("bar").style.width=`${Math.min(99,(t/end)*100)}%`;$("status").textContent=`분석 중… ${fmt(t)} / ${fmt(end)}`;await new Promise(r=>setTimeout(r,0))}
  $("bar").style.width="100%";$("status").textContent="분석 완료";
  const segs=compress(rows,step);const counts={};rows.forEach(r=>counts[r.label]=(counts[r.label]||0)+step);const dominant=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  $("duration").textContent=fmt(duration);$("frames").textContent=total;$("twoRate").textContent=`${Math.round(two/Math.max(1,total)*100)}%`;$("dominant").innerHTML=dominant?`가장 길게 검출된 상태: <b>${dominant[0]}</b> · 약 ${fmt(dominant[1])}`:"";
  const tl=$("timeline");tl.innerHTML="";segs.forEach(s=>{const d=document.createElement("div");d.className="segment";d.innerHTML=`<div class="time">${fmt(s.start)}–${fmt(Math.min(duration,s.end+step))}</div><div><div class="label">${s.label}</div><div class="note">${s.note}</div></div><div class="conf">${Math.round(s.conf*100)}%</div>`;tl.appendChild(d)});$("result").classList.remove("hidden");$("result").scrollIntoView({behavior:"smooth",block:"start"});
}
$("videoFile").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);$("video").src=objectUrl;$("preview").style.display="block";$("fileTitle").textContent=f.name;$("fileSub").textContent=`${(f.size/1024/1024).toFixed(1)} MB · 자동 분석 시작`;try{await analyze(f)}catch(err){console.error(err);$("status").textContent=`분석 실패: ${err.message||err}`;$("bar").style.width="0%"}});
$("again").onclick=()=>{$("videoFile").value="";$("result").classList.add("hidden");$("preview").style.display="none";$("fileTitle").textContent="🎥 스파링 영상 넣기";$("fileSub").textContent="누르면 휴대폰 영상 선택 · 선택 즉시 분석 시작";$("status").textContent="설정할 것 없습니다. 영상만 선택하세요.";$("bar").style.width="0%";window.scrollTo({top:0,behavior:"smooth"})};
</script>
</body>
</html>
